name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # creating the release and uploading artefacts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs the history for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A tag is not a reason to skip the gate: the same tests that guard main
      # guard a release, and a release that was never tested is a promise
      # nobody made.
      - name: Test (race, shuffled)
        run: go test -race -shuffle=on -count=1 ./...

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
