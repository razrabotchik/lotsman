name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.2 # keep in sync with GOLANGCI_VERSION in the Makefile, which `make tools` installs
  # CI does not read its Go from go.mod. That floor is the oldest release this
  # code claims to compile with; building on it means shipping and scanning a
  # standard library whose line has stopped taking security fixes. CI follows
  # the Go support policy (NFR-1), and the floor is one matrix entry below, so
  # the README's "Go >= 1.25" stays a claim a job can fail on.
  GO_VERSION: "1.27.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27.x"]
        include:
          # The declared floor, built and tested on one platform: a change that
          # needs a newer Go fails here instead of in a contributor's checkout.
          - os: ubuntu-latest
            go: "1.25.7"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Test (race, shuffled)
        run: go test -race -shuffle=on -count=1 ./...

  corpus:
    # The corpus is the regression test for translation *support*: it answers
    # "did this change move what lotsman can do to a real API, and which way?"
    # The documents are fetched from pinned refs rather than committed, so the
    # job needs network access and runs on one platform only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch the vendor corpus
        run: make corpus
      - name: Corpus smoke
        run: go test -run 'TestCorpus' -count=1 ./cmd/lotsman/

  fuzz:
    # A short fuzz run on every change: the seeds are the pitfalls, and a
    # regression in any of them is cheaper to find here than in a corpus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fuzz (short)
        run: make fuzz FUZZTIME=20s

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        # The pin here used to track the go.mod floor, which decided the toolchain.
        # It no longer does: this job runs a supported Go and can take the current
        # govulncheck, which is the one that knows about the newest advisories.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  image:
    # The image is built and exercised on every change, not only at a tag.
    # Acceptance criterion 11 is about what an operator runs, and an image
    # that is only assembled during a release is one whose first run is the
    # release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make image VERSION=ci COMMIT=${{ github.sha }}
      - name: The image is nonroot, read-only and reports its build
        run: make image-check
