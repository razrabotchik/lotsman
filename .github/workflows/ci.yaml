name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.2 # keep in sync with the version contributors run locally

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test (race, shuffled)
        run: go test -race -shuffle=on -count=1 ./...

  corpus:
    # The corpus is the regression test for translation *support*: it answers
    # "did this change move what lotsman can do to a real API, and which way?"
    # The documents are fetched from pinned refs rather than committed, so the
    # job needs network access and runs on one platform only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch the vendor corpus
        run: make corpus
      - name: Corpus smoke
        run: go test -run 'TestCorpus' -count=1 ./cmd/lotsman/

  fuzz:
    # A short fuzz run on every change: the seeds are the pitfalls, and a
    # regression in any of them is cheaper to find here than in a corpus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz (short)
        run: make fuzz FUZZTIME=20s

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        # Pinned, not @latest: setup-go pins GOTOOLCHAIN to the go.mod floor (1.25),
        # and govulncheck >= v1.8.0 requires Go 1.26 to build. Bump together with the floor.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
