# golangci-lint v2 configuration.
# Rules encode Constitution invariants where a linter can check them:
#   - stdout is protocol-only on stdio transport  -> forbidigo bans fmt.Print* outside cmd/
#   - untrusted inputs everywhere                 -> gosec, bodyclose, noctx
#   - errors carry machine-readable meaning       -> errcheck, errorlint
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - forbidigo
    - gocritic
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
    - gosec
  settings:
    errcheck:
      check-type-assertions: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: stdout belongs to the MCP protocol; write to stderr or to an injected io.Writer.
        - pattern: ^print(ln)?$
          msg: use log/slog on stderr.
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks: [whyNoLint]
    gosec:
      excludes:
        - G104 # duplicate of errcheck
    govet:
      enable: [shadow]
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: error-strings
        - name: context-as-argument
        - name: indent-error-flow
    staticcheck:
      checks: [all]
  exclusions:
    presets: [comments, common-false-positives, std-error-handling]
    rules:
      # cmd/ is the CLI surface: human-readable output on stdout is its job.
      - path: ^cmd/
        linters: [forbidigo]
      - path: _test\.go$
        linters: [gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/razrabotchik/lotsman]
